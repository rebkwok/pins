{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>{{ page.title }}</h1>

                {{ page.introduction|richtext }}

                {% for faq in page.faqs.all %}
                    <div class="faq">
                        <h2 class="h3">{{ faq.question }}</h2>
                        {{ faq.answer|richtext }}
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock content %}
