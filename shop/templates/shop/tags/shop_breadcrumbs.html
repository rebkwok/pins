{% if items %}
    <nav class="breadcrumb-container" aria-label="Breadcrumb">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <ol class="breadcrumb">
                        {% for item in items %}
                            {% if item.url %}
                                <li><a href="{{ item.url }}">{{ item.label }}</a>
                                    {% include "includes/chevron-icon.html" with class="breadcrumb__chevron-icon" %}
                                </li>
                            {% else %}
                                <li aria-current="page">{{ item.label }}</li>
                            {% endif %}
                        {% endfor %}
                    </ol>
                </div>
            </div>
        </div>
    </nav>
{% endif %}
