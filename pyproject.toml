[project]
name = "pins"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django<=6.1.1",
    "wagtail<=8.0",
    "crispy-bootstrap5<=2026.9",
    "django-allauth<=65.19.7",
    "django-crispy-forms<=2.7",
    "django-encrypted-json-fields<=1.0.5",
    "django-environ<=0.14.0",
    "django-extensions<=4.1",
    "psycopg2<=2.9.13",
    "gunicorn<=26.2.0",
    "htmx<=0.0.0",
    "pymemcache<=4.0.0",
    "whitenoise<=6.12.0",
    "facebook-sdk<=3.1.0",
    "wagtail-json-widget<=0.0.9",
    "django-salesman",
    "django-salesman-stripe-connect",
    "django-storages[boto3]<=1.14.6",
    "django-recaptcha<=4.1.0",
    "wagtail-django-recaptcha<=2.2.0",
    "django-paypal<=2.1",
    "wagtail-modeladmin<=2.5.0",
    "shortuuid<=1.0.13",
    "reportlab<=5.0.1",
    "html2text<=2025.4.15",
    "envdir<=1.0.1",
    "django-ses[events]<=4.8.2",
    "pygments<=2.21.0",
    "stripe>=16.0.0,<17",
]

[dependency-groups]
    dev = [
        "coverage<=7.16.2",
        "pytest<=9.1.1",
        "pytest-django<=4.14.0",
        "pytest-cov<=7.1.0",
        "pytest-env<=1.8.0",
        "pytest-freezer<=0.4.9",
        "pytest-xdist<=3.8.0",
        "wagtail-factories<=4.5.0",
        "ipython<=9.17.1",
        "model-bakery<=1.24.2",
        "ipdb<=0.13.13",
        "requests-mock>=1.12.1",
        "pytest-playwright>=0.10.0",
        "axe-playwright-python>=0.1.8",
]

[tool.uv.sources]
# Fork to allow django 6+
django-salesman = { git = "https://github.com/rebkwok/django-salesman.git", rev="12a6cdb0d36bbd544590c151aa2e0422fb72489e" }
django-salesman-stripe-connect = { git = "https://github.com/rebkwok/django-salesman-stripe-connect.git", rev="95cf15d06771502e68fb412444793597c8072273" }


[tool.pytest]
    # (the browser tests, marked e2e, are run separately: pytest -m e2e)
    addopts = ["--reuse-db", "-n" , "auto", "-m", "not e2e"]
    markers = ["e2e: browser (end-to-end) tests, with Playwright; run with -m e2e"]
    DJANGO_SETTINGS_MODULE = "pins.settings"

    env = [
        "TESTING=1",
        "SECRET_KEY=dummy_secret",
        "EMAIL_HOST_USER=dummy_user",
        "EMAIL_HOST_PASSWORD=dummy_password",
        "LOG_FOLDER=log_folder",
        "FB_APP_ID=dummy",
        "FB_APP_SECRET=dummy",
        "FB_ACCESS_TOKEN=dummy",
        "FB_PAGE_ID=1",
        "PAYPAL_EMAIL=dummy-email@hotmail.com",
        "PAYPAL_CUSTOM_KEY=dummy",
        "FIELD_ENCRYPTION_KEY='ddD0dDddD0DddD00DDDDDd0DDdd0DddDdd-DdD0ddDd='",
        "PDF_ENCRYPTION_KEY=dummy",
        "RECIPE_SUBMISSIONS_OPEN=True",
        "SALESMAN_STRIPE_CONNECT_SECRET_KEY=sk_test_dummy",
        "SALESMAN_STRIPE_CONNECT_WEBHOOK_SECRET=whsec_dummy",
        "SALESMAN_STRIPE_CONNECT_CLIENT_ID=ca_dummy",
    ]

[tool.coverage.run]
    omit = [
        "venv/*",
        ".venv/*",
        "*/migrations/*",
        "*/tests/*",
        "*/tests.py",
        "*/wsgi.py",
        "*/__init__.py",
        "manage.py",
        "scrape_albums.py",
    ]

    relative_files = true

[tool.coverage.report]
    skip_empty = true
    skip_covered = true
    fail_under = 71
